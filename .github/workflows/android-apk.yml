name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pixelmagic-ai-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name pixelmagic_ai .
      - name: Set minimum Android API for local media engines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          p.write_text(s)
          PY
      - name: Register Android auth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '            <intent-filter>\n                <action android:name="android.intent.action.MAIN"'
          block = '''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="io.supabase.pixelmagic" android:host="login-callback" />
                      </intent-filter>
          '''
          if "io.supabase.pixelmagic" not in s:
              pos = s.find("</activity>")
              if pos < 0:
                  raise SystemExit("Main activity not found in AndroidManifest.xml")
              s = s[:pos] + block + s[pos:]
              p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test
      - name: Analyze Dart source
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_zkNayqCx5XzGQLT_NL5Iyg_aGwgu5Bb
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMagic-AI-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
