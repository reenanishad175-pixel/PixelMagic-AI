name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name pixelmagic_ai .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_zkNayqCx5XzGQLT_NL5Iyg_aGwgu5Bb
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelMagic-AI-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
