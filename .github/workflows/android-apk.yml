name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: pixelmagic-ai-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore PixelMagic AI logo asset
        run: |
          mkdir -p assets
          base64 --decode assets/pixelmagic_logo.jpg.b64 > assets/pixelmagic_logo.jpg
          test -s assets/pixelmagic_logo.jpg
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name pixelmagic_ai .
      - name: Configure R8 rules for optional ML Kit scripts
        run: |
          mkdir -p android/app
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "proguard-rules.pro" not in s:
              marker = "            isMinifyEnabled = true"
              if marker in s:
                  s = s.replace(marker, marker + '\\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")', 1)
              else:
                  marker = "        getByName(\\"release\\") {"
                  if marker not in s:
                      raise SystemExit("Could not locate release build type to attach R8 rules")
                  s = s.replace(marker, marker + '\\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")', 1)
              p.write_text(s)
          PY
      - name: Set minimum Android API for local media engines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s, min_count = re.subn(r"(?m)^\s*minSdk\s*=.*$", "    minSdk = 24", s, count=1)
          s, compile_count = re.subn(r"(?m)^\s*compileSdk\s*=.*$", "    compileSdk = 36", s, count=1)
          if min_count != 1 or compile_count != 1:
              raise SystemExit("Could not set Android minSdk/compileSdk in generated Gradle file")
          p.write_text(s)
          PY
      - name: Register Android auth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          block = '''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="io.supabase.pixelmagic" android:host="login-callback" />
                      </intent-filter>
          '''
          if "io.supabase.pixelmagic" not in s:
              pos = s.find("</activity>")
              if pos < 0:
                  raise SystemExit("Main activity not found in AndroidManifest.xml")
              s = s[:pos] + block + s[pos:]
              p.write_text(s)
          PY
      - name: Add Android microphone permission for voice chat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if "android.permission.RECORD_AUDIO" not in s:
              pos = s.find("<application")
              if pos < 0:
                  raise SystemExit("Application tag not found in AndroidManifest.xml")
              s = s[:pos] + permission + s[pos:]
              p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Align file_picker Android compile SDK
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          config = json.loads(Path(".dart_tool/package_config.json").read_text())
          package = next((p for p in config["packages"] if p["name"] == "file_picker"), None)
          if package is None:
              raise SystemExit("file_picker package missing from package_config.json")
          uri = package["rootUri"]
          parsed = urlparse(uri)
          if parsed.scheme != "file":
              raise SystemExit(f"Unexpected file_picker package URI: {uri}")
          root = Path(unquote(parsed.path))
          candidates = [root / "android" / "build.gradle", root / "android" / "build.gradle.kts"]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit(f"file_picker Android Gradle file not found under {root}")
          source = gradle.read_text()
          if gradle.name.endswith(".kts"):
              replacement = "    compileSdk = 36"
              pattern = r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?.*$"
              insertion = r"(?m)^(\s*android\s*\{)"
          else:
              replacement = "    compileSdkVersion 36"
              pattern = r"(?m)^\s*compileSdk(?:Version)?\s+.*$"
              insertion = r"(?m)^(\s*android\s*\{)"
          updated, count = re.subn(pattern, replacement, source, count=1)
          if count == 0:
              updated, count = re.subn(insertion, r"\1\n" + replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Could not patch compileSdk in {gradle}; contents:\n{source}")
          gradle.write_text(updated)
          print(f"Patched {gradle} to compileSdk 36")
          print("\n".join(line for line in updated.splitlines() if "compileSdk" in line))
          PY
      - name: Run Flutter tests
        run: flutter test
      - name: Analyze Dart source
        run: flutter analyze
      - name: Build optimized split release APKs
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_zkNayqCx5XzGQLT_NL5Iyg_aGwgu5Bb
      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelMagic-AI-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pixelmagic-build-${{ github.run_number }}
          name: PixelMagic AI Build #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
