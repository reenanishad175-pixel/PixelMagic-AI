name: pixelmagic_ai
description: PixelMagic AI - Flutter starter app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  gal: ^2.3.0
  video_player: ^2.9.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  speech_to_text: ^7.3.0
  file_picker: ^8.1.7
  image: ^4.5.4
  pdf: ^3.11.3
  printing: ^5.14.2
  pdfx: ^2.8.0
  google_mlkit_selfie_segmentation: ^1.0.2
  google_mlkit_text_recognition: ^1.0.3
  ffmpeg_kit_flutter_new_video: ^2.5.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/pixelmagic_logo.jpg
  adaptive_icon_background: "#080B2B"
  adaptive_icon_foreground: assets/pixelmagic_logo.jpg
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/pixelmagic_logo.jpg
